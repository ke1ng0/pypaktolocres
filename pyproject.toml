[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pypaktolocres"
version = "0.1.0"
description = "Stream a UE .pak, extract FText EN sources (no full unpack), and build a .locres"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyuepak>=0.2.8",
    "pylocres>=0.1.9.2",
    "cryptography",
]

[project.scripts]
pypaktolocres = "pypaktolocres.__main__:main"

[tool.setuptools]
packages = ["pypaktolocres"]
